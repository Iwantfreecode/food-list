<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>food on the way</title>

  <!-- font: Courier Prime (typed-text look) -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <!-- map library: Leaflet (draws the map and the pins) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- ?v=2 forces browsers to fetch the newest style.css instead of an old saved copy -->
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <h1>food on the way</h1>
  <p>type where we start and where we're going. <mark>the site shows our saved places</mark> that are on the route or a short detour away.</p>

  <hr>

  <p>
    mode:
    <label><input type="radio" name="mode" value="route" checked> route</label>
    <label><input type="radio" name="mode" value="spot"> pick a spot</label>
    <label><input type="radio" name="mode" value="all"> all places</label>
  </p>

  <!-- FILTERS: used by every mode. "all" in a dropdown means no filter. -->
  <div id="filters">
    <label for="f-food">food</label>
    <select id="f-food"><option value="">all</option></select>

    <label for="f-type">type</label>
    <select id="f-type"><option value="">all</option></select>

    <label for="f-area">area</label>
    <select id="f-area"><option value="">all</option></select>
  </div>

  <hr>

  <!-- ROUTE mode -->
  <div id="route-box">
    <label for="start">from</label>
    <input id="start" type="text" placeholder="e.g. KMITL Ladkrabang">
    <p>
      <button id="start-here">[ my location ]</button>
      <button id="start-pick">[ pick on map ]</button>
    </p>

    <label for="end">to</label>
    <input id="end" type="text" placeholder="e.g. Pattaya">
    <p>
      <button id="end-here">[ my location ]</button>
      <button id="end-pick">[ pick on map ]</button>
    </p>

    <p>
      max detour:
      <label><input type="radio" name="limit" value="10" checked> 10 min</label>
      <label><input type="radio" name="limit" value="20"> 20 min</label>
    </p>

    <button id="go">[ find food ]</button>
  </div>

  <!-- SPOT mode -->
  <div id="spot-box" hidden>
    <label for="spot">spot</label>
    <input id="spot" type="text" placeholder="type a place, or tap the map below">
    <p><button id="here">[ use my location ]</button></p>

    <p>
      max drive:
      <label><input type="radio" name="drive" value="5"> 5 min</label>
      <label><input type="radio" name="drive" value="10" checked> 10 min</label>
      <label><input type="radio" name="drive" value="20"> 20 min</label>
    </p>

    <button id="go-spot">[ find food near here ]</button>
  </div>

  <!-- ALL mode: nothing to type, the list shows by itself -->
  <div id="all-box" hidden>
    <p>every saved place on the map. use the filters above to narrow it down.</p>
  </div>

  <p id="status"></p>

  <hr>

  <div id="map"></div>

  <h2 id="list-title">on the route</h2>
  <ul id="results"></ul>

  <!-- ?v=3 forces browsers to fetch the newest app.js -->
  <script src="app.js?v=5"></script>
</body>
</html>
